name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      # Audit the exact locked graph without rebuilding it from node_modules.
      # Bound registry retries so an advisory outage cannot occupy the runner
      # for the default five-minute socket timeout before reporting failure.
      - run: npm audit --package-lock-only --audit-level=high --fetch-timeout=60000 --fetch-retries=2
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run web:verify
      - run: npm run lite:verify
